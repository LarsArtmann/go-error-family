name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run tests (workspace)
        run: go test -race -count=1 ./...

      - name: Run tests (diagnose module)
        working-directory: ./diagnose
        run: go test -race -count=1 ./...

      - name: Run tests (agent module)
        working-directory: ./agent
        run: go test -race -count=1 ./...

      - name: Run tests (bridge submodule)
        working-directory: ./bridge
        run: go test -race -count=1 ./...

      - name: Run tests (git submodule)
        working-directory: ./diagnose/git
        run: go test -race -count=1 ./...

      - name: Run tests (postgres submodule)
        working-directory: ./diagnose/postgres
        run: go test -race -count=1 ./...

      - name: Run tests (examples module)
        working-directory: ./examples
        run: go test -race -count=1 ./...

      - name: Verify root builds without workspace
        run: GOWORK=off go build ./...

      - name: Verify root module graph resolves (GOWORK=off)
        run: GOWORK=off go list -m all

      - name: Run go vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m

      - name: Run golangci-lint (diagnose module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          working-directory: ./diagnose

      - name: Run golangci-lint (agent module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          working-directory: ./agent

      - name: Run golangci-lint (bridge submodule)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          working-directory: ./bridge

      - name: Run golangci-lint (git submodule)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          working-directory: ./diagnose/git

      - name: Run golangci-lint (postgres submodule)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          working-directory: ./diagnose/postgres

      - name: Run golangci-lint (examples module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          working-directory: ./examples

  consumer-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Simulate consumer importing root module
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          go mod init consumer-test
          printf 'package main\n\nimport _ "github.com/larsartmann/go-error-family"\n\nfunc main() {}\n' > main.go
          GOWORK=off go mod edit -replace github.com/larsartmann/go-error-family=$GITHUB_WORKSPACE
          GOWORK=off go mod tidy
          GOWORK=off go build ./...
          GOWORK=off go list -m all

  # Fleet workflow policy (adopted 2026-11-02, cue-policy docs/
  # 2026-11-02_adoption-memo.md): external cue schemas vet the workflow
  # files for the policy classes actionlint has no concept of — action pin
  # formats, runner allowlist, permission shape, release concurrency
  # guards. The policy checkout is pinned by commit SHA: a policy change
  # cannot silently redefine what this repo's CI enforces (bumping the pin
  # is a deliberate, reviewable act).
  policy-vet:
    name: Workflow Policy (cue vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install pinned cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Check out the fleet policy schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LarsArtmann/cue-policy
          ref: 7ecfcaf037309d83daf7c2e48375870de66285a2
          path: cue-policy
          persist-credentials: false

      - name: Vet workflows against the fleet policy
        run: |
          cue vet -d '#ReleaseWorkflow' ./cue-policy .github/workflows/release.yml
          cue vet -d '#CIWorkflow' ./cue-policy .github/workflows/ci.yml
          cue vet -d '#CIWorkflow' ./cue-policy .github/workflows/website-check.yml
          cue vet -d '#CIWorkflow' ./cue-policy .github/workflows/website-deploy.yml
