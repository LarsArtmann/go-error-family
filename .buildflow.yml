# Note on GOEXPERIMENT: do NOT add an `env:` override here — BuildFlow's
# ApplyConfigEnv never overrides shell-exported values, and this machine
# exports GOEXPERIMENT=jsonv2 globally (required by the BuildFlow repo
# itself). The no-json/v2 policy is enforced instead by a depguard deny rule
# in .golangci.yml, which fails lint locally, in BuildFlow, and in CI.
skip_steps:
  # go-auto-upgrade's `fix` command runs the jsonv1tov2 migrator, which
  # rewrites encoding/json → encoding/json/v2 whenever GOEXPERIMENT=jsonv2 is
  # active (it is, machine-globally). For this library that rewrite violates
  # the documented no-json/v2 policy (v0.8.0 reverted it: GOEXPERIMENT was
  # the #1 adoption barrier) and breaks the hermetic nix builds and CI. This
  # skip stops the fleet-wide `buildflow --fix` orchestrator from re-breaking
  # the repo on every pass.
  - go-auto-upgrade
  # pnpm-audit runs `pnpm audit` at the REPO ROOT, but the only pnpm-lock.yaml
  # lives in website/ — a separate Node project with its own flake.nix and
  # deploy pipeline. With no root lockfile the step fails closed with
  # ERR_PNPM_AUDIT_NO_LOCKFILE (verified 2026-09-18 with
  # BUILDFLOW_NO_RESULT_CACHE=1 — the cached ✔ hid the failure). Skipped until
  # BuildFlow's pnpm-audit supports subdirectory lockfiles (upstream candidate).
  # Dependabot ALERTS still detect website vulnerabilities, but Dependabot's
  # automatic security-update jobs fail on this repo (npm updater vs pnpm v9
  # lockfile + overrides — every job since 2026-09-15 errored out), so the
  # working remediation check is manual: `nix develop -c pnpm audit` in
  # website/. Last clean: 2026-09-18 (8 transitive vulns in devalue, fast-uri,
  # js-yaml, svgo fixed via `pnpm update --depth Infinity`).
  - pnpm-audit
  # BuildFlow's embedded go-structure-linter snapshot predates project-config
  # support: it ignores this repo's .go-structure-linter.yaml (which uses the
  # "flat" preset because the root package IS the published library API —
  # /pkg/ restructure would break 50+ consumers) and keeps erroring on the
  # deliberate flat layout. Run `go-structure-linter .` directly instead; it
  # go-structure-linter snapshot ignores this repo's .go-structure-linter.yaml
  # (see above), so it is skipped too.
  - go-structure-linter
  # branching-flow's phantom analyzer (a) suggests phantom-typing every
  # exported string field/parameter of this library's published protocol
  # types — a breaking API change by definition, and (b) does not honor its
  # own // branching-flow:ignore directives (IsIgnored is wired into
  # roleak/do/panic but NOT pkg/phantom — see branching-flow source). Until
  # the phantom analyzer grows ignore support, it cannot be scoped down here.
  - branching-flow
  # nix-hash-fix repairs vendorHash FOD mismatches, but this flake has no
  # vendorHash (plain go build via pkgs.go_1_26; no vendor/ directory), so
  # the step's default-package probe fails structurally: it targets
  # packages.x86_64-linux.default, which this flake does not provide (it
  # exposes named checks like checks.format instead). Deterministic failure,
  # verified 2026-09-18 (42/42 historical failures). Re-add if a vendored
  # Go build with vendorHash is ever introduced.
  - nix-hash-fix
